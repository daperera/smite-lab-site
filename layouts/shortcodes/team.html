<div class="team-grid">
  {{ range site.Data.team }}
    <div class="team-member">
      <img src="{{ .image | relURL }}"
     alt="{{ .name }}"
     onerror='this.onerror=null; this.src="{{ "img/team/default.jpg" | relURL }}";'>
      <div class="team-info">
        <div class="team-name">{{ .name }}</div>
        <div class="team-role">{{ .role }}</div>
        <!-- <div class="team-description">{{ .description }}</div> -->
      </div>
    </div>
  {{ end }}
</div>
